<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOWER Points Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0f19;
      color: #f1f5f9;
      padding: 20px;
    }

    .card {
      background: #161f30;
      border: 1px solid #283548;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
    }

    .result-box {
      margin-top: 24px;
      padding: 18px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .result-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .result-total span:first-child {
      font-weight: bold;
      color: #f8fafc;
    }

    .result-total .points {
      font-size: 1.5rem;
      font-weight: 700;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>FLOWER Rewards Calculator</h2>

    <!-- Dropdown Menu -->
    <div class="form-group">
      <label for="tierSelect">Select Tier</label>
      <select id="tierSelect" onchange="calculatePoints()">
        <option value="0.10" data-min="50" data-max="499">Tier 1: 50 – 499 FLOWER (10%)</option>
        <option value="0.20" data-min="500" data-max="4999">Tier 2: 500 – 4,999 FLOWER (20%)</option>
        <option value="0.40" data-min="5000" data-max="49999">Tier 3: 5,000 – 49,999 FLOWER (40%)</option>
        <option value="0.80" data-min="50000" data-max="Infinity">Tier 4: 50,000+ FLOWER (80%)</option>
      </select>
    </div>

    <!-- Amount Input -->
    <div class="form-group">
      <label for="amount">Amount Deposited (FLOWER)</label>
      <input type="number" id="amount" value="100" min="0" step="any" oninput="calculatePoints()" />
    </div>

    <!-- Multiplier Input -->
    <div class="form-group">
      <label for="multiplier">Weekly Multiplier</label>
      <input type="number" id="multiplier" value="2.8" min="1" step="0.1" oninput="calculatePoints()" />
    </div>

    <!-- Results Display -->
    <div class="result-box">
      <div class="result-row">
        <span>Tier Bonus Rate</span>
        <span id="rateLabel">10%</span>
      </div>
      <div class="result-row">
        <span>Effective Multiplier</span>
        <span id="effectiveMultiplier">1.28x</span>
      </div>
      <div class="result-total">
        <span>Points Gained</span>
        <span class="points" id="totalPoints">290.00</span>
      </div>
    </div>
  </div>

  <script>
    function calculatePoints() {
      const tierSelect = document.getElementById('tierSelect');
      const rate = parseFloat(tierSelect.value);
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const multiplier = parseFloat(document.getElementById('multiplier').value) || 1;

      // Formula: Deposit * (1 + (Rate * Multiplier))
      const effectiveMult = 1 + (rate * multiplier);
      const pointsGained = amount * effectiveMult;

      // Update UI
      document.getElementById('rateLabel').textContent = `${(rate * 100).toFixed(0)}%`;
      document.getElementById('effectiveMultiplier').textContent = `${effectiveMult.toFixed(2)}x`;
      document.getElementById('totalPoints').textContent = pointsGained.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    // Run on first load
    calculatePoints();
  </script>
</body>
</html>
