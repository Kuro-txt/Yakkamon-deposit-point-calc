<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yakkamon Points Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0f19;
      color: #f1f5f9;
      padding: 20px;
    }

    .card {
      background: #161f30;
      border: 1px solid #283548;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
    }

    .result-box {
      margin-top: 24px;
      padding: 18px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .result-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .result-total span:first-child {
      font-weight: bold;
      color: #f8fafc;
    }

    .result-total .points {
      font-size: 1.5rem;
      font-weight: 700;
      color: #4ade80;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Yakkamon Point Calculator</h2>

    <!-- Amount Input (Defaults to 0) -->
    <div class="form-group">
      <label for="amount">Amount Deposited (FLOWER)</label>
      <input type="number" id="amount" value="0" min="0" step="any" oninput="onAmountChanged()" />
    </div>

    <!-- Tier Dropdown (Defaults to 0.00) -->
    <div class="form-group">
      <label for="tierSelect">Select Tier</label>
      <select id="tierSelect" onchange="calculatePoints()">
        <option value="0.00" selected>Below Tier: < 50 FLOWER (0%)</option>
        <option value="0.10">Tier 1: 50 – 499 FLOWER (10%)</option>
        <option value="0.20">Tier 2: 500 – 4,999 FLOWER (20%)</option>
        <option value="0.40">Tier 3: 5,000 – 49,999 FLOWER (40%)</option>
        <option value="0.80">Tier 4: 50,000+ FLOWER (80%)</option>
      </select>
    </div>

    <!-- Weekly Multiplier Dropdown -->
    <div class="form-group">
      <label for="multiplierSelect">Weekly Multiplier</label>
      <select id="multiplierSelect" onchange="calculatePoints()">
        <option value="2.8">2.8x</option>
        <option value="2.6">2.6x</option>
        <option value="2.4">2.4x</option>
        <option value="2.2">2.2x</option>
        <option value="2.0">2.0x</option>
        <option value="1.8">1.8x</option>
        <option value="1.6">1.6x</option>
        <option value="1.4">1.4x</option>
        <option value="1.2">1.2x</option>
        <option value="1.0">1.0x</option>
      </select>
    </div>

    <!-- Results Display -->
    <div class="result-box">
      <div class="result-row">
        <span>Tier Bonus</span>
        <span id="rateLabel">0%</span>
      </div>
      <div class="result-row">
        <span>Selected Multiplier</span>
        <span id="multLabel">2.8x</span>
      </div>
      <div class="result-total">
        <span>Points Gained</span>
        <span class="points" id="totalPoints">0.00</span>
      </div>
    </div>

    <!-- Footer Credit -->
    <div class="footer">
      Inspired by <a href="https://www.youtube.com/@xeko" target="_blank" rel="noopener noreferrer">Xeko</a>'s Yakkamon Deposit Calculator Sheet
    </div>
  </div>

  <script>
    function updateTierByAmount(amount) {
      const tierSelect = document.getElementById('tierSelect');

      if (amount >= 50000) {
        tierSelect.value = "0.80";
      } else if (amount >= 5000) {
        tierSelect.value = "0.40";
      } else if (amount >= 500) {
        tierSelect.value = "0.20";
      } else if (amount >= 50) {
        tierSelect.value = "0.10";
      } else {
        tierSelect.value = "0.00";
      }
    }

    function onAmountChanged() {
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      updateTierByAmount(amount);
      calculatePoints();
    }

    function calculatePoints() {
      const tierRate = parseFloat(document.getElementById('tierSelect').value);
      const weeklyMultiplier = parseFloat(document.getElementById('multiplierSelect').value);
      const amount = parseFloat(document.getElementById('amount').value) || 0;

      // Formula: Amount * (Weekly Multiplier + Tier Bonus Rate)
      const pointsGained = amount * (weeklyMultiplier + tierRate);

      // Update UI labels and results
      document.getElementById('rateLabel').textContent = `${(tierRate * 100).toFixed(0)}%`;
      document.getElementById('multLabel').textContent = `${weeklyMultiplier.toFixed(1)}x`;
      document.getElementById('totalPoints').textContent = pointsGained.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    // Run on initial page load (evaluates with amount = 0)
    onAmountChanged();
  </script>
</body>
</html>
